---
# Reconcile Projects

- name: "[DRY RUN] Display projects to be created"
  ansible.builtin.debug:
    msg: "Would create project: {{ item.name }} from {{ item.scm_url | default('no SCM') }}"
  loop: "{{ platform_state.projects }}"
  when: dry_run

- name: Ensure projects exist
  ansible.controller.project:
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    organization: "{{ item.organization }}"
    scm_type: "{{ item.scm_type | default(omit) }}"
    scm_url: "{{ item.scm_url | default(omit) }}"
    scm_branch: "{{ item.scm_branch | default(omit) }}"
    credential: "{{ item.scm_credential | default(omit) }}"
    scm_update_on_launch: "{{ item.scm_update_on_launch | default(false) }}"
    scm_update_cache_timeout: "{{ item.scm_update_cache_timeout | default(omit) }}"
    controller_host: "{{ controller_host }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_validate_certs }}"
    state: present
  loop: "{{ platform_state.projects }}"
  loop_control:
    label: "{{ item.name }}"
  when: not dry_run
  register: _projects_result

- name: Display project reconciliation results
  ansible.builtin.debug:
    msg: "Project '{{ item.item.name }}': {{ 'CHANGED' if item.changed else 'OK' }}"
  loop: "{{ _projects_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not dry_run
